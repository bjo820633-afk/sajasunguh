<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>끝</title>
  <style>
    body {        
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    width: 800px;
    margin: 30px auto;
    padding: 0 16px;    
}

/* 전체 박스 */
.container {
    background-color: white;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* 제목 */
h1 {
    margin-bottom: 20px;
    margin-left: 300px;
    margin-right: 300px;
}

/* 현재 점수 */
#score {
    font-size: 50px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* 랭킹 */
ol {
    padding: 0;
    list-style: none;
    margin: 0;
}

/* 랭킹 아이템 */
li {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

/* 마지막 줄 선 제거 */
li:last-child {
    border-bottom: none;
}

/* 1등 강조 (과하지 않게) */
li:first-child {
    font-weight: bold;
}

/* 버튼 */
button {
    margin-top: 20px;
    padding: 10px 20px;
    border: 1px solid #2c3e50;
    background: #ffffff;
    color: #2c3e50;
    cursor: pointer;
    border-radius: 8px;
}

/* 버튼 hover */
button:hover {
    background: #2c3e50;
    color: #ffffff;
}</style>
</head>
<body>
  <div class="container">
    <h1>게임 종료</h1>
    <div id="score">
        <span id="myScore"></span>점
        </div>
      <button id="restart-btn" onclick="goToReMain()">다시 하기</button>
      <ol id="ranking"></ol>
    </div>
</body>
    <script>
        window.onload = function () {
            // 🔥 현재 점수
            const myScore = localStorage.getItem("currentScore");
            document.getElementById("myScore").innerText = myScore;

            // 🔥 랭킹
            let scores = JSON.parse(localStorage.getItem("scores")) || [];

            let ranking = document.getElementById("ranking");
            ranking.innerHTML = "";

            scores.forEach(score => {
                let li = document.createElement("li");
                li.innerText = score + "점";
                ranking.appendChild(li);
            });
        };
        function goToReMain() {
      window.location.href = "realmain.html";
    }
    </script>
</html>
